<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>машинка</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(#87ceeb 65%, #555 65%);
      min-height: 100vh;
    }
    
     
    .car {
      position: absolute;
      bottom: 30%;
      width: 200px;
      height: 50px;
      background: #ff789c; 
      border-radius: 10px 40px 5px 5px;
      animation: move 4s ease-out forwards;
    }
    
    
    .car::before {
      content: '';
      position: absolute;
      top: -20px;
      left: 45px;
      width: 90px;
      height: 20px;
      background: #e3f2fd; 
      border: 4px solid #ff789c; 
      border-bottom: none;
      border-radius: 10px 10px 0 0;
    }
    
      
    .car::after {
      content: '';
      position: absolute;
      bottom: -15px; 
      left: 0;
      width: 200px;  
      height: 30px;  
      
      background: 
        radial-gradient(circle, #333 15px, transparent 16px) no-repeat 30px 0,
        radial-gradient(circle, #333 15px, transparent 16px) no-repeat 140px 0;
      background-size: 30px 30px;
    }
    
    
    @keyframes move {
      0% { transform: translateX(-200px); }
      100% { transform: translateX(calc(100vw - 250px)); }
    }
  </style>
</head>
<body>

  <div class="car"></div>

</body>
</html>
